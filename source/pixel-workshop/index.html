<style>

            padding: 25px 30px 30px 30px;
            border: 1px solid var(--anzhiyu-card-border, #2d3346);
            max-width: 1000px;
            width: 100%;
            margin: 0 auto;
            box-sizing: border-box;
        }

        #pixel-workshop .workshop-title {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin: 0 0 20px 0;
            font-size: 2rem;
            font-weight: 600;
            letter-spacing: 2px;
            color: var(--anzhiyu-fontcolor, #eaeefb);
            text-shadow: none;
        }

        #pixel-workshop .workshop-title span {
            background: #2d3346;
            border-radius: 14px;
            padding: 6px 16px;
            font-size: 0.9rem;

            letter-spacing: 0.5px;
            color: #b7c2e6;
            text-shadow: none;
            box-shadow: inset 0 -2px 0 #0a0c12;

            justify-content: center;
            margin-bottom: 8px;
            background: #1b1f2d;

            box-shadow: inset 0 0 0 2px #0b0e14, inset 0 0 20px #00000080;

        #pixel-workshop .workshop-title {

        @media (max-width: 600px) {

                padding: 16px 10px;

            }

                font-size: 1.4rem;
            }
            #pixel-workshop .toolbar {
                padding: 12px 8px;

            }
            #pixel-workshop .canvas-wrapper {

            }

    </style>

    <div id="pixel-workshop" class="app">
        <div class="workshop-title">
            ⬛ 像素工坊
            <span>自定义画布 + 导出</span>
        </div>

        <div class="canvas-wrapper">
            <canvas id="pixelCanvas" aria-label="像素绘画画布">你的浏览器不支持 Canvas。</canvas>
        </div>
        <div class="canvas-info" id="canvasInfo">画布尺寸: 16 x 16</div>

        <div class="toolbar">
            <div class="size-control">
                <label for="gridSizeInput">网格</label>
                <input type="number" id="gridSizeInput" min="1" max="128" value="16" step="1">
            </div>

            <div class="color-picker-wrapper">
                <label for="colorPicker">颜色</label>
                <input type="color" id="colorPicker" value="#FF6B9D">
            </div>

            <button type="button" id="clearBtn" class="clear-btn">
                🧹 清空
            </button>

            <button type="button" id="exportBtn" class="export-btn">
                📥 导出 PNG
            </button>
        </div>

        <div class="hint">
            <span><kbd>点击</kbd> 或 <kbd>拖动</kbd> 绘制</span>
            <span><kbd>右键</kbd> 擦除</span>
            <span><kbd>调整网格</kbd> 保留左上角内容，缩小会裁剪</span>
        </div>
    </div>

    <script data-pjax>
        (function() {
            // ---------- 核心配置 ----------
            const canvas = document.getElementById('pixelCanvas');
            if (!canvas || canvas.dataset.initialized === 'true') return;
            const ctx = canvas.getContext('2d');
            if (!ctx) return;
            canvas.dataset.initialized = 'true';
            const canvasInfo = document.getElementById('canvasInfo');

            let gridSize = 16;               // 网格数量 (N x N)
            let cellSize = 24;               // 每个像素格的基准像素大小
            const MIN_CELL_SIZE = 4;         // 最小格子像素
            const MAX_CELL_SIZE = 80;        // 最大格子像素

            let pixels = [];                 // 二维数组，存储颜色值
            let canvasDisplaySize = 0;       // 当前画布物理尺寸（正方形）

            // UI 元素
            const gridSizeInput = document.getElementById('gridSizeInput');
            const colorPicker = document.getElementById('colorPicker');
            const clearBtn = document.getElementById('clearBtn');
            const exportBtn = document.getElementById('exportBtn');

            // 鼠标状态
            let isDrawing = false;
            let isErasing = false;
            let lastPaintCell = null;

            // ---------- 计算合适的格子大小 ----------
            function calculateCellSize(gridN) {
                // 目标画布展示大小约 600px
                const targetDisplay = 600;
                let size = Math.floor(targetDisplay / gridN);
                // 限制范围：最小 4px，最大 80px
                size = Math.min(MAX_CELL_SIZE, Math.max(MIN_CELL_SIZE, size));
                return size;
            }

            // ---------- 初始化像素矩阵 ----------
            function initPixelArray(size) {
                pixels = Array(size).fill().map(() => Array(size).fill(null));
            }

            // ---------- 调整画布尺寸（保留内容） ----------
            function resizeCanvas(newGridSize, preserveContent = true) {
                // 保存旧数据
                const oldPixels = pixels;
                const oldGridSize = gridSize;

                // 更新尺寸
                gridSize = newGridSize;
                cellSize = calculateCellSize(gridSize);
                canvasDisplaySize = cellSize * gridSize;

                // 设置 canvas 物理尺寸
                canvas.width = canvasDisplaySize;
                canvas.height = canvasDisplaySize;

                // 创建新的像素数组
                initPixelArray(gridSize);

                // 如果保留内容且旧数据存在，按左上角对齐复制
                if (preserveContent && oldPixels.length > 0 && oldGridSize > 0) {
                    const copyRows = Math.min(gridSize, oldGridSize);
                    const copyCols = Math.min(gridSize, oldGridSize);
                    for (let row = 0; row < copyRows; row++) {
                        for (let col = 0; col < copyCols; col++) {
                            pixels[row][col] = oldPixels[row][col];
                        }
                    }
                }

                // 更新信息
                canvasInfo.textContent = `画布尺寸: ${gridSize} x ${gridSize}  |  每格 ${cellSize}px`;

                // 重绘
                renderPixels();
            }

            // ---------- 渲染所有像素块 (含网格线) ----------
            function renderPixels() {
                // 清空
                ctx.clearRect(0, 0, canvasDisplaySize, canvasDisplaySize);

                // 1. 背景
                ctx.fillStyle = '#11141e';
                ctx.fillRect(0, 0, canvasDisplaySize, canvasDisplaySize);

                // 2. 绘制所有非空像素块
                for (let row = 0; row < gridSize; row++) {
                    for (let col = 0; col < gridSize; col++) {
                        const color = pixels[row][col];
                        if (color) {
                            ctx.fillStyle = color;
                            const x = col * cellSize;
                            const y = row * cellSize;
                            ctx.fillRect(x, y, cellSize, cellSize);
                        }
                    }
                }

                // 3. 绘制网格线 (半透明，覆盖在像素上)
                ctx.lineWidth = 1.2;
                ctx.strokeStyle = '#3b4463';
                ctx.globalAlpha = 0.45;
                ctx.beginPath();
                for (let i = 0; i <= gridSize; i++) {
                    const pos = i * cellSize;
                    ctx.moveTo(pos, 0);
                    ctx.lineTo(pos, canvasDisplaySize);
                    ctx.moveTo(0, pos);
                    ctx.lineTo(canvasDisplaySize, pos);
                }
                ctx.stroke();
                ctx.globalAlpha = 1.0;

                // 4. 外边框强调
                ctx.lineWidth = 3;
                ctx.strokeStyle = '#5d6a96';
                ctx.strokeRect(0, 0, canvasDisplaySize, canvasDisplaySize);
            }

            // ---------- 根据坐标计算单元格 ----------
            function getCellFromEvent(e) {
                const rect = canvas.getBoundingClientRect();
                const scaleX = canvas.width / rect.width;
                const scaleY = canvas.height / rect.height;

                let canvasX = (e.clientX - rect.left) * scaleX;
                let canvasY = (e.clientY - rect.top) * scaleY;

                // 边界裁剪
                canvasX = Math.min(Math.max(canvasX, 0), canvasDisplaySize - 0.001);
                canvasY = Math.min(Math.max(canvasY, 0), canvasDisplaySize - 0.001);

                const col = Math.floor(canvasX / cellSize);
                const row = Math.floor(canvasY / cellSize);

                if (row >= 0 && row < gridSize && col >= 0 && col < gridSize) {
                    return { row, col };
                }
                return null;
            }

            // ---------- 绘制单个像素 ----------
            function paintCell(row, col, erase = false) {
                if (row < 0 || row >= gridSize || col < 0 || col >= gridSize) return false;

                const newColor = erase ? null : colorPicker.value;
                if (pixels[row][col] === newColor) return false;

                pixels[row][col] = newColor;
                return true;
            }

            // ---------- 重绘 ----------
            function redrawAll() {
                renderPixels();
            }

            // ---------- 指针事件处理 ----------
            function onPointerDown(e) {
                e.preventDefault();
                canvas.setPointerCapture(e.pointerId);

                const cell = getCellFromEvent(e);
                if (!cell) return;

                const isRightClick = (e.button === 2);
                isDrawing = true;
                isErasing = isRightClick && (e.pointerType === 'mouse');

                lastPaintCell = { row: cell.row, col: cell.col };
                const changed = paintCell(cell.row, cell.col, isErasing);
                if (changed) redrawAll();
            }

            function onPointerMove(e) {
                if (!isDrawing) return;
                e.preventDefault();

                const rect = canvas.getBoundingClientRect();
                const scaleX = canvas.width / rect.width;
                const scaleY = canvas.height / rect.height;
                let canvasX = (e.clientX - rect.left) * scaleX;
                let canvasY = (e.clientY - rect.top) * scaleY;

                if (canvasX < 0 || canvasX >= canvasDisplaySize || canvasY < 0 || canvasY >= canvasDisplaySize) {
                    return;
                }

                const cell = getCellFromEvent(e);
                if (!cell) return;

                if (lastPaintCell && lastPaintCell.row === cell.row && lastPaintCell.col === cell.col) {
                    return;
                }

                const changed = paintCell(cell.row, cell.col, isErasing);
                if (changed) redrawAll();
                lastPaintCell = { row: cell.row, col: cell.col };
            }

            function onPointerUp(e) {
                e.preventDefault();
                if (canvas.hasPointerCapture(e.pointerId)) {
                    canvas.releasePointerCapture(e.pointerId);
                }
                isDrawing = false;
                isErasing = false;
                lastPaintCell = null;
            }

            // 阻止右键菜单
            canvas.addEventListener('contextmenu', (e) => e.preventDefault());

            // 绑定事件
            canvas.addEventListener('pointerdown', onPointerDown);
            canvas.addEventListener('pointermove', onPointerMove);
            canvas.addEventListener('pointerup', onPointerUp);
            canvas.addEventListener('pointercancel', onPointerUp);

            // 防止触摸滚动
            canvas.addEventListener('touchstart', (e) => e.preventDefault(), { passive: false });
            canvas.addEventListener('touchmove', (e) => e.preventDefault(), { passive: false });

            // ---------- 导出图片功能 ----------
            function exportAsPNG() {
                const exportCanvas = document.createElement('canvas');
                const exportCtx = exportCanvas.getContext('2d');

                const exportSize = canvasDisplaySize;
                // 如果尺寸太小，放大到至少 400px
                const scale = Math.max(1, Math.floor(400 / exportSize));
                const finalSize = exportSize * scale;

                exportCanvas.width = finalSize;
                exportCanvas.height = finalSize;

                // 填充深色背景（与画布一致）
                exportCtx.fillStyle = '#11141e';
                exportCtx.fillRect(0, 0, finalSize, finalSize);

                // 绘制像素块，不带网格线
                const exportCellSize = (exportSize / gridSize) * scale;
                for (let row = 0; row < gridSize; row++) {
                    for (let col = 0; col < gridSize; col++) {
                        const color = pixels[row][col];
                        if (color) {
                            exportCtx.fillStyle = color;
                            const x = col * exportCellSize;
                            const y = row * exportCellSize;
                            exportCtx.fillRect(x, y, exportCellSize, exportCellSize);
                        }
                    }
                }

                // 导出
                const link = document.createElement('a');
                link.download = `pixel-art-${gridSize}x${gridSize}-${Date.now()}.png`;
                link.href = exportCanvas.toDataURL('image/png');
                link.click();
            }

            // ---------- 控件事件 ----------
            // 网格尺寸改变（使用 change 事件，输入框失焦或回车触发）
            gridSizeInput.addEventListener('change', (e) => {
                let newSize = parseInt(e.target.value, 10);
                if (isNaN(newSize)) newSize = 16;
                newSize = Math.min(128, Math.max(1, newSize));  // 限制 1~128
                e.target.value = newSize;

                // 如果和当前网格大小相同，不处理
                if (newSize === gridSize) return;

                // 调整画布，保留内容
                resizeCanvas(newSize, true);
            });

            // 也支持按回车立即生效
            gridSizeInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') {
                    e.target.blur();  // 触发 change 事件
                }
            });

            // 清空按钮
            clearBtn.addEventListener('click', () => {
                initPixelArray(gridSize);
                renderPixels();
            });

            // 导出按钮
            exportBtn.addEventListener('click', exportAsPNG);

            // ---------- 启动 ----------
            function init() {
                // 初始化画布，不保留内容
                resizeCanvas(16, false);
                colorPicker.value = '#FF6B9D';
            }

            init();
        })();
    </script>
